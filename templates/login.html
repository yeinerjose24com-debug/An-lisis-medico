<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>
  <style>
    :root{
      --bg:#f6f9fc;
      --card:#ffffffcc;
      --accent:#2563eb;
      --muted:#6b7280;
      --radius:14px;
      --shadow: 0 8px 24px rgba(16,24,40,0.06);
      --glass: rgba(255,255,255,0.7);
      --glass-shadow: 0 6px 18px rgba(37,99,235,0.06);
    }
    *{ box-sizing:border-box; margin:0; padding:0; font-family:'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    body{ background: linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; color:#0f172a; }
    .login-container{ background:var(--card); padding:32px 28px; border-radius:var(--radius); box-shadow:var(--shadow); width:360px; }
    .login-container h2{margin-bottom:20px; font-size:20px; text-align:center; color:var(--accent); }
    .login-container input{width:100%; padding:10px 12px; margin-bottom:14px; border:1px solid #e6eefc; border-radius:10px; background:white; font-weight:600; color:#0f172a;}
    .login-container button{width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:700;}
    .error{color:var(--danger); margin-bottom:12px; font-size:13px; text-align:center;}
    .logo{width:58px; height:58px; margin:0 auto 18px; border-radius:12px; background:linear-gradient(135deg,var(--accent),#6b8cff); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:24px; box-shadow:0 6px 18px rgba(37,99,235,0.16); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">HS</div>
    <h2>Iniciar sesión</h2>
    {% if error %}<div class="error" style="color:#dc2626; font-size:14px; margin-bottom:12px; text-align:center;">{{ error }}</div>{% endif %}
    <!-- Credenciales de ejemplo: admin / admin -->
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input type="text" name="username" placeholder="Usuario" required />
      <input type="password" name="password" placeholder="Clave" required />
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
